

spring.datasource.url=jdbc:postgresql://localhost:5432/rebook
spring.datasource.username=postgres
spring.datasource.password=123
spring.datasource.driver-class-name=org.postgresql.Driver

# Tell Spring Boot to run our SQL init scripts on startup.
# "always" means it runs every startup (safe because schema uses IF NOT EXISTS
# and data uses ON CONFLICT DO NOTHING).
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.data-locations=classpath:db/data.sql
