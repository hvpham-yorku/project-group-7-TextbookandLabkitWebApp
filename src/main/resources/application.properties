spring.application.name=rebook-maven

spring.profiles.active=stub

# Disable Thymeleaf template caching so changes apply without restart
spring.thymeleaf.cache=false

# Disable static resource caching so CSS/JS changes are served immediately
spring.web.resources.cache.period=0

# Multipart file upload — allow up to 5 MB per image
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
