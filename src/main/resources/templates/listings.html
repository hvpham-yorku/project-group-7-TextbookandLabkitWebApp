<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Listings - YorkU Circle</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css(v=9)}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar('browse')}"></div>

<div class="container yk-page-wrap">

  <!-- Page heading -->
  <div class="yk-page-head">
    <h2 class="yk-page-title">Browse Listings</h2>
  </div>

  <!-- Filter Form -->
  <div class="yk-card mb-4">
    <div class="yk-card-body">
      <h5 class="yk-card-section-title">Filter Listings</h5>
      <form action="/listings/filter" method="get" class="row g-3">
        <div class="col-md-4">
          <label class="form-label">Keyword</label>
          <input type="text" class="form-control" name="keyword"
                 placeholder="Search title or description"
                 th:value="${keyword}">
        </div>
        <div class="col-md-3">
          <label class="form-label">Status</label>
          <select class="form-select" name="status">
            <option value="">All</option>
            <option value="AVAILABLE"
                    th:selected="${status != null and status.name() == 'AVAILABLE'}">Available</option>
            <option value="UNAVAILABLE"
                    th:selected="${status != null and status.name() == 'UNAVAILABLE'}">Unavailable</option>
            <option value="SOLD"
                    th:selected="${status != null and status.name() == 'SOLD'}">Sold</option>
          </select>
        </div>
        <div class="col-md-2">
          <label class="form-label">Min Price ($)</label>
          <input type="number" class="form-control" name="minPrice"
                 step="0.01" min="0" placeholder="0.00"
                 th:value="${minPrice}">
        </div>
        <div class="col-md-2">
          <label class="form-label">Max Price ($)</label>
          <input type="number" class="form-control" name="maxPrice"
                 step="0.01" min="0" placeholder="Any"
                 th:value="${maxPrice}">
        </div>
        <div class="col-md-1 d-flex align-items-end">
          <button type="submit" class="btn btn-primary w-100">Filter</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Sort Controls -->
  <div class="mb-3 d-flex gap-2 flex-wrap">
    <a href="/listings" class="btn btn-outline-secondary btn-sm">All</a>
    <a href="/listings/sort/price" class="btn btn-sm"
       th:classappend="${sortBy == 'price-asc'} ? ' btn-primary' : ' btn-outline-secondary'">Price ↑</a>
    <a href="/listings/sort/price-desc" class="btn btn-sm"
       th:classappend="${sortBy == 'price-desc'} ? ' btn-primary' : ' btn-outline-secondary'">Price ↓</a>
    <a href="/listings/sort/title" class="btn btn-sm"
       th:classappend="${sortBy == 'title-asc'} ? ' btn-primary' : ' btn-outline-secondary'">Title A→Z</a>
    <a href="/listings/sort/title-desc" class="btn btn-sm"
       th:classappend="${sortBy == 'title-desc'} ? ' btn-primary' : ' btn-outline-secondary'">Title Z→A</a>
  </div>

  <!-- Listings Table -->
  <div class="yk-card">
    <div class="yk-card-body">

      <div th:if="${#lists.isEmpty(listings)}" class="bm-empty-state" style="padding: 2.5rem 1rem;">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
        <p>No listings found. Try a different filter.</p>
      </div>

      <div th:unless="${#lists.isEmpty(listings)}" class="table-responsive">
        <table class="yk-table">
          <thead>
          <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Description</th>
            <th>Seller</th>
            <th>Price</th>
            <th>Status</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="l : ${listings}">
            <td th:text="${l.id}"></td>
            <td th:text="${l.title}"></td>
            <td th:text="${l.description}"></td>
            <td th:text="${l.sellerEmail}"></td>
            <td th:text="'$' + ${l.price}"></td>
            <td>
              <span class="yk-status yk-status-available"
                    th:if="${l.status == T(com.example.demo.domain.ListingStatus).AVAILABLE}">Available</span>
              <span class="yk-status yk-status-unavailable"
                    th:if="${l.status == T(com.example.demo.domain.ListingStatus).UNAVAILABLE}">Unavailable</span>
              <span class="yk-status yk-status-sold"
                    th:if="${l.status == T(com.example.demo.domain.ListingStatus).SOLD}">Sold</span>
            </td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

</div>

</body>
</html>
