<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - YorkU Circle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css(v=10)}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar('notifications')}"></div>

<div class="container yk-page-wrap">

    <!-- Page heading -->
    <div class="yk-page-head">
        <h2 class="yk-page-title">Notifications</h2>
        <p class="yk-page-sub"
           th:text="${unreadCount > 0} ? ${unreadCount} + ' unread' : 'All caught up'"></p>
    </div>

    <!-- Empty state -->
    <div th:if="${#lists.isEmpty(notifications)}" class="bm-empty-state">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6V11c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/>
        </svg>
        <p>No notifications yet. You'll be notified when buyers contact you about your listings.</p>
    </div>

    <!-- Notification list -->
    <div th:unless="${#lists.isEmpty(notifications)}" class="notif-layout">

        <div th:each="notif : ${notifications}"
             th:class="${!notif.read} ? 'yk-card notif-item notif-item-unread' : 'yk-card notif-item'">
            <div class="yk-card-body">

                <!-- Top row: type badge + date -->
                <div class="notif-row">
                    <span class="notif-type-badge"
                          th:text="${notif.type.name()}"></span>
                    <span class="notif-date"
                          th:text="${#temporals.format(notif.createdAt, 'MMM d, yyyy')}"></span>
                </div>

                <!-- Message -->
                <p class="notif-message" th:text="${notif.message}"></p>

                <!-- Mark as read button — only for unread notifications -->
                <form th:if="${!notif.read}"
                      th:action="@{/notifications/{id}/read(id=${notif.id})}"
                      method="post"
                      class="notif-read-form">
                    <button type="submit" class="btn btn-outline-secondary btn-sm">
                        Mark as read
                    </button>
                </form>

            </div>
        </div>

    </div>

</div>

</body>
</html>
