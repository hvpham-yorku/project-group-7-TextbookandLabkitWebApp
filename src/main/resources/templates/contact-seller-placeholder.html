<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Seller - YorkU Circle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css(v=9)}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar('browse')}"></div>

<div class="container yk-page-wrap">

    <!-- Back link -->
    <a th:href="@{/listings/{id}(id=${listing.id})}" class="yk-back-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
        </svg>
        Back to Listing
    </a>

    <div class="yk-card" style="max-width: 560px;">
        <div class="yk-card-body">

            <div class="yk-page-head">
                <h2 class="yk-page-title">Contact Seller</h2>
                <p class="yk-page-sub">
                    Listing: <span th:text="${listing.title}"></span>
                </p>
            </div>

            <div class="alert alert-info" role="alert">
                The full contact form is coming in the next update.
                For now, you can reach the seller directly at:
                <strong th:text="${listing.sellerEmail}"></strong>
            </div>

            <a th:href="@{/listings/{id}(id=${listing.id})}" class="btn btn-outline-secondary">
                Back to Listing
            </a>

        </div>
    </div>

</div>

</body>
</html>
