<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Chat – YorkU Circle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/style.css(v=10)}"/>
    <style>
        .gc-card {
            background: #fff;
            border: 1px solid #ebe8e4;
            border-radius: 12px;
            overflow: hidden;
            max-width: 780px;
        }
        .gc-feed {
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
            padding: 1.25rem;
            min-height: 320px;
            max-height: 480px;
            overflow-y: auto;
            background: #fafaf9;
        }
        .gc-bubble-wrap {
            display: flex;
            flex-direction: column;
            max-width: 68%;
            gap: 0.2rem;
        }
        .gc-bubble-wrap.is-mine {
            align-self: flex-end;
            align-items: flex-end;
        }
        .gc-bubble-wrap.is-theirs {
            align-self: flex-start;
            align-items: flex-start;
        }
        .gc-meta {
            font-size: 0.72rem;
            color: #6b6b6b;
        }
        .gc-bubble {
            padding: 0.6rem 0.9rem;
            border-radius: 14px;
            font-size: 0.875rem;
            line-height: 1.55;
            word-break: break-word;
        }
        .gc-bubble.mine {
            background: #8c1d40;
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .gc-bubble.theirs {
            background: #f0ece8;
            color: #1a1a1a;
            border-bottom-left-radius: 4px;
        }
        .gc-input-row {
            display: flex;
            gap: 0.65rem;
            align-items: flex-end;
            padding: 1rem 1.25rem;
            border-top: 1px solid #ede9e4;
            background: #fff;
        }
        .gc-textarea {
            flex: 1;
            border-radius: 20px;
            border: 1px solid #d8d7d5;
            padding: 0.5rem 0.9rem;
            font-size: 0.875rem;
            resize: none;
            background: #fafaf9;
            color: #1a1a1a;
            outline: none;
            font-family: inherit;
        }
        .gc-textarea:focus {
            border-color: #8c1d40;
            box-shadow: 0 0 0 3px rgba(140,29,64,0.12);
        }
        .gc-send-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #8c1d40;
            border: none;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s;
        }
        .gc-send-btn:hover { background: #6f1633; }
        .gc-empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            min-height: 260px;
            color: #6b6b6b;
            gap: 0.5rem;
            font-size: 0.9rem;
            text-align: center;
        }
    </style>
</head>
<body class="browse-page">

<div th:replace="~{fragments/navbar :: navbar('chat')}"></div>

<div class="container bm-page-wrap">

    <!-- Page heading -->
    <div class="bm-heading-block">
        <h2 class="bm-page-title">Community Chat</h2>
        <p class="bm-page-subtitle">A shared chat room for all YorkU Circle members. Say hello, ask questions, or help a fellow student.</p>
    </div>

    <!-- Flash error -->
    <div th:if="${errorMessage}" class="alert alert-danger mb-3" th:text="${errorMessage}"></div>

    <!-- Chat card -->
    <div class="gc-card">

        <!-- Message feed -->
        <div class="gc-feed" id="gcFeed">

            <!-- Empty state -->
            <div th:if="${#lists.isEmpty(messages)}" class="gc-empty">
                <svg width="38" height="38" fill="#ccc8c3" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/>
                </svg>
                <p>No messages yet — be the first to say something!</p>
            </div>

            <!-- Messages -->
            <th:block th:each="msg : ${messages}">
                <div class="gc-bubble-wrap"
                     th:classappend="${msg.senderEmail == currentUserEmail} ? 'is-mine' : 'is-theirs'">
                    <span class="gc-meta"
                          th:text="${msg.senderEmail} + ' · ' + ${#temporals.format(msg.sentAt, 'MMM d, h:mm a')}">
                    </span>
                    <div class="gc-bubble"
                         th:classappend="${msg.senderEmail == currentUserEmail} ? 'mine' : 'theirs'"
                         th:text="${msg.content}">
                    </div>
                </div>
            </th:block>

        </div>

        <!-- Input area -->
        <div class="gc-input-row">
            <form th:action="@{/chat/send}" method="post"
                  style="display:flex; gap:0.65rem; align-items:flex-end; flex:1;">
                <textarea class="gc-textarea" name="content" rows="1"
                          placeholder="Type a message..."
                          onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();this.form.submit();}"></textarea>
                <button type="submit" class="gc-send-btn" title="Send">&#9658;</button>
            </form>
        </div>

    </div>

</div>

<script>
    // Scroll to the latest message on page load
    const feed = document.getElementById('gcFeed');
    if (feed) feed.scrollTop = feed.scrollHeight;
</script>

</body>
</html>
