<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - YorkU Circle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css(v=9)}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar('profile')}"></div>

<div class="container yk-page-wrap">
    <div class="yk-profile-card yk-card">
        <div class="yk-card-body">

            <div class="yk-page-head">
                <h2 class="yk-page-title">My Profile</h2>
            </div>

            <dl class="row yk-info-list mb-0">
                <dt class="col-sm-4">Name</dt>
                <dd class="col-sm-8" th:text="${user.name}">—</dd>

                <dt class="col-sm-4">Email</dt>
                <dd class="col-sm-8" th:text="${user.email}">—</dd>

                <dt class="col-sm-4">Student ID</dt>
                <dd class="col-sm-8"
                    th:text="${user.studentId != null} ? ${user.studentId} : '—'">—</dd>

                <dt class="col-sm-4">Phone</dt>
                <dd class="col-sm-8"
                    th:text="${user.phoneNumber != null and !#strings.isEmpty(user.phoneNumber)} ? ${user.phoneNumber} : '—'">—</dd>

                <dt class="col-sm-4">Program</dt>
                <dd class="col-sm-8"
                    th:text="${user.program != null and !#strings.isEmpty(user.program)} ? ${user.program} : '—'">—</dd>

                <dt class="col-sm-4">Campus</dt>
                <dd class="col-sm-8"
                    th:text="${user.campus != null and !#strings.isEmpty(user.campus)} ? ${user.campus} : '—'">—</dd>

                <dt class="col-sm-4">About Me</dt>
                <dd class="col-sm-8"
                    th:text="${user.aboutMe != null and !#strings.isEmpty(user.aboutMe)} ? ${user.aboutMe} : '—'">—</dd>
            </dl>

            <div class="mt-4">
                <a th:href="@{/profile/edit}" class="btn btn-primary">Edit Profile</a>
            </div>

        </div>
    </div>
</div>

</body>
</html>
