<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Blocked Users – YorkU Circle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/style.css(v=10)}"/>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar('blocked-users')}"></div>

<div class="container yk-page-wrap" style="max-width:640px;">

    <a th:href="@{/profile}" class="yk-back-link">&#8592; Back to profile</a>

    <div class="yk-page-head">
        <h2 class="yk-page-title">Blocked Users</h2>
        <p class="yk-page-sub">Users you have blocked cannot contact you through the site.</p>
    </div>

    <!-- Flash messages -->
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}"   class="alert alert-danger"  th:text="${errorMessage}"></div>

    <!-- Empty state -->
    <div class="yk-card" th:if="${#lists.isEmpty(blockedUsers)}">
        <div class="yk-card-body text-center py-5">
            <p style="color:#6b6b6b; font-size:0.92rem; margin:0;">You haven't blocked anyone.</p>
        </div>
    </div>

    <!-- Blocked users list -->
    <div class="yk-card" th:unless="${#lists.isEmpty(blockedUsers)}">
        <table class="yk-table">
            <thead>
                <tr>
                    <th>User</th>
                    <th>Blocked on</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="blocked : ${blockedUsers}">
                    <td th:text="${blocked.blockedEmail}">user@example.com</td>
                    <td th:text="${#temporals.format(blocked.blockedAt, 'MMM d, yyyy')}">Mar 27, 2026</td>
                    <td style="text-align:right;">
                        <form th:action="@{/unblock/{email}(email=${blocked.blockedEmail})}" method="post">
                            <button type="submit" class="btn btn-outline-secondary btn-sm">Unblock</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</div>

</body>
</html>
