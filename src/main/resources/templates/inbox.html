<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inbox - YorkU Circle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css(v=9)}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar('inbox')}"></div>

<div class="container yk-page-wrap">

    <!-- Page heading -->
    <div class="yk-page-head">
        <h2 class="yk-page-title">Inbox</h2>
        <p class="yk-page-sub">Messages received about your listings — <span th:text="${user.email}"></span></p>
    </div>

    <!-- Empty state -->
    <div th:if="${#lists.isEmpty(messages)}" class="bm-empty-state">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
        </svg>
        <p>No inquiries yet. When buyers contact you about a listing, their messages will appear here.</p>
    </div>

    <!-- Message list -->
    <div th:unless="${#lists.isEmpty(messages)}" class="inbox-layout">

        <div th:each="msg : ${messages}"
             class="inbox-item yk-card"
             th:with="l=${listingMap.get(msg.listingId)}">
            <div class="yk-card-body">

                <!-- Listing reference row + date -->
                <div class="inbox-listing-row">
                    <span class="bm-badge-course"
                          th:if="${l != null and l.courseCode != null and !#strings.isEmpty(l.courseCode)}"
                          th:text="${l.courseCode}"></span>
                    <a th:if="${l != null}"
                       th:href="@{/listings/{id}(id=${msg.listingId})}"
                       class="inbox-listing-title"
                       th:text="${l.title}"></a>
                    <span th:unless="${l != null}" class="inbox-listing-title-gone">
                        Listing #<span th:text="${msg.listingId}"></span>
                    </span>
                    <span class="inbox-date"
                          th:text="${#temporals.format(msg.createdAt, 'MMM d, yyyy')}"></span>
                </div>

                <!-- From -->
                <p class="inbox-from">
                    From: <strong th:text="${msg.senderEmail}"></strong>
                </p>

                <!-- Subject -->
                <p class="inbox-subject" th:text="${msg.subject}"></p>

                <!-- Message body -->
                <p class="inbox-body" th:text="${msg.message}"></p>

            </div>
        </div>

    </div>

</div>

</body>
</html>
