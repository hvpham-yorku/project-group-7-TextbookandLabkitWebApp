<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Listings - YorkU Circle</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css(v=9)}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar('my-listings')}"></div>

<div class="container yk-page-wrap">

  <!-- Page heading -->
  <div class="yk-page-head">
    <h2 class="yk-page-title">My Listings</h2>
    <p class="yk-page-sub">Signed in as <span th:text="${user.email}"></span></p>
  </div>

  <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

  <!-- Add Listing Form -->
  <div class="yk-card mb-4">
    <div class="yk-card-body">
      <h5 class="yk-card-section-title">Add a New Listing</h5>
      <form action="/listings" method="post" enctype="multipart/form-data">

        <div class="mb-3">
          <label for="title" class="form-label">Title</label>
          <input type="text" class="form-control" id="title" name="title"
                 placeholder="e.g. EECS 2311 Textbook" required>
        </div>

        <div class="mb-3">
          <label for="description" class="form-label">Description</label>
          <input type="text" class="form-control" id="description" name="description"
                 placeholder="e.g. Good condition, some highlights." required>
        </div>

        <div class="mb-3">
          <label for="price" class="form-label">Price ($)</label>
          <input type="number" class="form-control" id="price" name="price"
                 step="0.01" min="0" placeholder="e.g. 40.00" required>
        </div>

        <div class="row g-3">
          <div class="col-md-4">
            <label for="courseCode" class="form-label">Course Code</label>
            <input type="text" class="form-control" id="courseCode" name="courseCode"
                   placeholder="e.g. EECS 2311">
          </div>
          <div class="col-md-4">
            <label for="materialType" class="form-label">Material Type</label>
            <select class="form-select" id="materialType" name="materialType">
              <option value="">(Optional)</option>
              <option value="Textbook">Textbook</option>
              <option value="Lab Kit">Lab Kit</option>
              <option value="Notes">Notes</option>
            </select>
          </div>
          <div class="col-md-4">
            <label for="condition" class="form-label">Condition</label>
            <select class="form-select" id="condition" name="condition">
              <option value="">(Optional)</option>
              <option value="New">New</option>
              <option value="Good">Good</option>
              <option value="Fair">Fair</option>
              <option value="Poor">Poor</option>
            </select>
          </div>
        </div>

        <div class="row g-3 mt-1">
          <div class="col-md-4">
            <label for="exchangeType" class="form-label">Exchange Type</label>
            <select class="form-select" id="exchangeType" name="exchangeType">
              <option value="">(Optional)</option>
              <option value="Sell">Sell</option>
              <option value="Trade">Trade</option>
              <option value="Free">Free</option>
              <option value="Giveaway">Giveaway</option>
            </select>
          </div>
          <div class="col-md-4">
            <label for="isbn" class="form-label">ISBN (Optional)</label>
            <input type="text" class="form-control" id="isbn" name="isbn"
                   placeholder="e.g. 9780134685991">
          </div>
          <div class="col-md-4">
            <label for="bookstorePrice" class="form-label">Bookstore Price ($, Optional)</label>
            <input type="number" class="form-control" id="bookstorePrice" name="bookstorePrice"
                   step="0.01" min="0" placeholder="e.g. 120.00">
          </div>
        </div>

        <div class="mb-3 mt-3">
          <label for="imageFile" class="form-label">
            Listing Image
            <span class="form-text ms-1">(Optional — JPG, PNG, or WebP, max 5 MB)</span>
          </label>
          <input type="file" class="form-control" id="imageFile" name="imageFile"
                 accept=".jpg,.jpeg,.png,.webp">
        </div>

        <button type="submit" class="btn btn-primary">Add Listing</button>

      </form>
    </div>
  </div>

  <!-- Listings Table -->
  <div class="yk-card">
    <div class="yk-card-body">
      <h5 class="yk-card-section-title">Your Active Listings</h5>

      <div th:if="${#lists.isEmpty(listings)}" class="bm-empty-state" style="padding: 2.5rem 1rem;">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 3c1.93 0 3.5 1.57 3.5 3.5S13.93 13 12 13s-3.5-1.57-3.5-3.5S10.07 6 12 6zm7 13H5v-.23c0-.62.28-1.2.76-1.58C7.47 15.82 9.64 15 12 15s4.53.82 6.24 2.19c.48.38.76.97.76 1.58V19z"/>
        </svg>
        <p>You don't have any listings yet.</p>
      </div>

      <div th:unless="${#lists.isEmpty(listings)}" class="table-responsive">
        <table class="yk-table">
          <thead>
          <tr>
            <th>Title</th>
            <th>Description</th>
            <th>Price</th>
            <th>Bookstore</th>
            <th>Save</th>
            <th>Status</th>
            <th>Edit</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="l : ${listings}">
            <td th:text="${l.title}"></td>
            <td class="td-truncate" th:text="${l.description}"></td>
            <td th:text="'$' + ${l.price}"></td>
            <td>
              <span th:if="${l.bookstorePrice != null}" th:text="'$' + ${l.bookstorePrice}"></span>
              <span th:unless="${l.bookstorePrice != null}" class="text-muted">—</span>
            </td>
            <td>
              <span th:if="${l.savingsPercent != null}"
                    class="yk-savings"
                    th:text="${l.savingsPercent} + '%'"></span>
              <span th:unless="${l.savingsPercent != null}" class="text-muted">—</span>
            </td>
            <td>
              <span class="yk-status yk-status-available"
                    th:if="${l.status == T(com.example.demo.domain.ListingStatus).AVAILABLE}">Available</span>
              <span class="yk-status yk-status-unavailable"
                    th:if="${l.status == T(com.example.demo.domain.ListingStatus).UNAVAILABLE}">Unavailable</span>
              <span class="yk-status yk-status-sold"
                    th:if="${l.status == T(com.example.demo.domain.ListingStatus).SOLD}">Sold</span>
            </td>
            <td>
              <a th:href="@{/listings/{id}/edit(id=${l.id})}"
                 class="btn btn-outline-primary btn-sm">Edit</a>
            </td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

</div>

</body>
</html>
