<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Listing - YorkU Circle</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css(v=9)}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar('my-listings')}"></div>

<div class="container yk-page-wrap">

  <!-- Back link -->
  <a href="/my-listings" class="yk-back-link">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
    </svg>
    Back to My Listings
  </a>

  <!-- Page heading -->
  <div class="yk-page-head">
    <h2 class="yk-page-title">Edit Listing</h2>
    <p class="yk-page-sub">Listing ID: <span th:text="${listing.id}"></span></p>
  </div>

  <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

  <!-- Update form -->
  <div class="yk-card mb-4">
    <div class="yk-card-body">
      <h5 class="yk-card-section-title">Update Details</h5>

      <form th:action="@{/listings/{id}/edit(id=${listing.id})}" method="post">

        <div class="mb-3">
          <label for="title" class="form-label">Title</label>
          <input type="text" class="form-control" id="title" name="title"
                 th:value="${listing.title}" required>
        </div>

        <div class="mb-3">
          <label for="description" class="form-label">Description</label>
          <input type="text" class="form-control" id="description" name="description"
                 th:value="${listing.description}" required>
        </div>

        <div class="mb-3">
          <label for="price" class="form-label">Price ($)</label>
          <input type="number" class="form-control" id="price" name="price"
                 step="0.01" min="0" th:value="${listing.price}" required>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label for="isbn" class="form-label">ISBN (Optional)</label>
            <input type="text" class="form-control" id="isbn" name="isbn"
                   th:value="${listing.isbn}">
          </div>
          <div class="col-md-6">
            <label for="bookstorePrice" class="form-label">Bookstore Price ($, Optional)</label>
            <input type="number" class="form-control" id="bookstorePrice" name="bookstorePrice"
                   step="0.01" min="0" th:value="${listing.bookstorePrice}">
          </div>
        </div>

        <div class="mb-3">
          <label for="status" class="form-label">Status</label>
          <select class="form-select" id="status" name="status">
            <option th:each="s : ${statuses}"
                    th:value="${s}"
                    th:selected="${s == listing.status}"
                    th:text="${s}">
            </option>
          </select>
        </div>

        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary">Save Changes</button>
          <a href="/my-listings" class="btn btn-outline-secondary">Cancel</a>
        </div>

      </form>
    </div>
  </div>

  <!-- Danger zone -->
  <div class="yk-card">
    <div class="yk-card-body">
      <div class="yk-danger-zone">
        <form th:action="@{/listings/{id}/delete(id=${listing.id})}"
              method="post"
              onsubmit="return confirm('Are you sure you want to delete this listing?');">
          <button type="submit" class="btn btn-danger">Delete Listing</button>
        </form>
      </div>
    </div>
  </div>

</div>

</body>
</html>
