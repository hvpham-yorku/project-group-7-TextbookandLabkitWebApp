<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Seller - YorkU Circle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css(v=9)}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar('browse')}"></div>

<div class="container yk-page-wrap">

    <!-- Back link -->
    <a th:href="@{/listings/{id}(id=${listing.id})}" class="yk-back-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
             fill="currentColor" aria-hidden="true">
            <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
        </svg>
        Back to Listing
    </a>

    <!-- Page heading -->
    <div class="yk-page-head">
        <h2 class="yk-page-title">Contact Seller</h2>
        <p class="yk-page-sub">
            Send a message about: <strong th:text="${listing.title}"></strong>
        </p>
    </div>

    <!-- Contact form card -->
    <div class="yk-card" style="max-width: 620px;">
        <div class="yk-card-body">
            <h5 class="yk-card-section-title">Your Message</h5>

            <!--
                Form action is set up for KAN-92.
                POST handler not yet implemented — submission has no effect until KAN-92.
            -->
            <form th:action="@{/listings/{id}/contact(id=${listing.id})}" method="post">

                <div class="mb-3">
                    <label for="subject" class="form-label">Subject</label>
                    <input type="text"
                           class="form-control"
                           id="subject"
                           name="subject"
                           placeholder="e.g. Is this still available?"
                           required>
                </div>

                <div class="mb-3">
                    <label for="message" class="form-label">Message</label>
                    <textarea class="form-control"
                              id="message"
                              name="message"
                              rows="5"
                              placeholder="Write your message to the seller..."
                              required></textarea>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Send Message</button>
                    <a th:href="@{/listings/{id}(id=${listing.id})}"
                       class="btn btn-outline-secondary">Cancel</a>
                </div>

            </form>
        </div>
    </div>

</div>

</body>
</html>
