<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Listings - YorkU Circle</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css(v=9)}">
</head>
<!-- browse-page class enables the subtle off-white page background -->
<body class="browse-page">

<div th:replace="~{fragments/navbar :: navbar('browse')}"></div>

<div class="container bm-page-wrap">

    <!-- Page heading -->
    <div class="bm-heading-block">
        <h2 class="bm-page-title">Browse Materials</h2>
        <p class="bm-page-subtitle">Search and browse course materials listed by YorkU students — textbooks, lab kits, notes, and more.</p>
    </div>
	
	<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <!-- Search + sort panel -->
    <div class="bm-search-panel">
        <form method="get" action="/browse" class="bm-search-form">
            <div class="bm-input-wrap">
                <input type="text" class="form-control bm-search-input"
                       name="q"
                       placeholder="Search by title, course code, or ISBN..."
                       th:value="${q}">
            </div>
            <div class="bm-controls-wrap">
                <select class="form-select bm-sort-select" name="sortBy">
                    <option value="newest"       th:selected="${sortBy == 'newest'}">Newest</option>
                    <option value="priceAsc"     th:selected="${sortBy == 'priceAsc'}">Price: Low to High</option>
                    <option value="priceDesc"    th:selected="${sortBy == 'priceDesc'}">Price: High to Low</option>
                    <option value="courseAsc"    th:selected="${sortBy == 'courseAsc'}">Course Code: A → Z</option>
                    <option value="conditionAsc" th:selected="${sortBy == 'conditionAsc'}">Condition</option>
                </select>
                <button class="btn btn-primary bm-search-btn" type="submit">Search</button>
            </div>
        </form>
    </div>

    <!-- Empty state -->
    <div th:if="${#lists.isEmpty(listings)}" class="bm-empty-state">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
        <p>No course materials found. Try a different search or check back later.</p>
    </div>

    <!-- Result count — shown only when results exist -->
    <div th:unless="${#lists.isEmpty(listings)}" class="bm-result-count">
        <span th:text="${#lists.size(listings)} + ' listing' + (${#lists.size(listings)} != 1 ? 's' : '') + ' found'"></span>
    </div>

    <!-- Listing grid -->
    <div th:unless="${#lists.isEmpty(listings)}" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">

        <div class="col" th:each="l : ${listings}">

            <!-- Entire card is one clickable anchor — no nested button -->
            <a class="bm-card-link"
               th:href="@{/listings/{id}(id=${l.id})}"
               th:attr="aria-label='View listing: ' + ${l.title}">

                <div class="bm-card">

                    <!-- Image: full-width, edge-to-edge top -->
                    <div class="bm-card-img-wrap">
                        <img th:if="${l.imagePath != null and !#strings.isEmpty(l.imagePath)}"
                             th:src="${l.imagePath}"
                             th:alt="${l.title}"
                             class="bm-card-img">

                        <!-- Placeholder: warm-toned, icon-centered, intentional -->
                        <div th:unless="${l.imagePath != null and !#strings.isEmpty(l.imagePath)}"
                             class="bm-card-img-placeholder">
                            <svg xmlns="http://www.w3.org/2000/svg"
                                 viewBox="0 0 24 24"
                                 class="bm-placeholder-icon"
                                 aria-hidden="true">
                                <path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/>
                            </svg>
                            <span class="bm-placeholder-text">No photo</span>
                        </div>
                    </div>

                    <!-- Card content -->
                    <div class="bm-card-body">

                        <!-- Badges: course code + availability -->
                        <div class="bm-card-badges">
                            <span class="bm-badge-course"
                                  th:if="${l.courseCode != null and !#strings.isEmpty(l.courseCode)}"
                                  th:text="${l.courseCode}"></span>
                            <span class="bm-badge-status bm-badge-available"
                                  th:if="${l.status == T(com.example.demo.domain.ListingStatus).AVAILABLE}">Available</span>
                            <span class="bm-badge-status bm-badge-unavailable"
                                  th:if="${l.status == T(com.example.demo.domain.ListingStatus).UNAVAILABLE}">Unavailable</span>
                            <span class="bm-badge-status bm-badge-sold"
                                  th:if="${l.status == T(com.example.demo.domain.ListingStatus).SOLD}">Sold</span>
                        </div>

                        <!-- Title: bold, 2-line clamped -->
                        <h5 class="bm-card-title" th:text="${l.title}"></h5>

                        <!-- Price: prominent -->
                        <div class="bm-card-price">
                            <span th:text="'$' + ${l.price}"></span>
                        </div>

                        <!-- Meta chips: condition · exchange type · material type -->
                        <div class="bm-card-meta">
                            <span class="bm-meta-chip"
                                  th:if="${l.condition != null and !#strings.isEmpty(l.condition)}"
                                  th:text="${l.condition}"></span>
                            <span class="bm-meta-chip"
                                  th:if="${l.exchangeType != null and !#strings.isEmpty(l.exchangeType)}"
                                  th:text="${l.exchangeType}"></span>
                            <span class="bm-meta-chip"
                                  th:if="${l.materialType != null and !#strings.isEmpty(l.materialType)}"
                                  th:text="${l.materialType}"></span>
                        </div>

                    </div>
                </div>
            </a>

        </div>
    </div>

</div>

</body>
</html>
